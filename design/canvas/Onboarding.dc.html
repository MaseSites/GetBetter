<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap">
  <style>
    :root{
      --paper:#FBFAF7; --sunken:#F2F0E9; --card:#FFFFFF;
      --ink:#14150F; --ink2:#55574C; --ink3:#6E7064;
      --line:#E5E2D9; --line2:#D2CEC2;
      --signal:#C9F23F; --signal-deep:#5E7610;
      --org:#4A5FD0; --health:#D0524A; --home:#B0701F; --money:#2E8C7A;
      --e1:0 1px 2px rgba(20,21,15,.05), 0 0 0 1px rgba(20,21,15,.055);
      --e2:0 10px 28px -12px rgba(20,21,15,.20), 0 0 0 1px rgba(20,21,15,.05);
      --ease-out:cubic-bezier(.23,1,.32,1);
      --ui:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      --dis:"Bricolage Grotesque", "Instrument Sans", system-ui, sans-serif;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);font-family:var(--ui);color:var(--ink);
      -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
    a{color:var(--signal-deep);text-decoration:none}
    a:hover{color:var(--ink)}
    button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;
      transition:transform 160ms var(--ease-out)}
    button:active{transform:scale(.98)}
    .screen{width:390px;height:844px;display:flex;flex-direction:column;
      background:var(--paper);overflow:hidden;padding:0 24px}

    .top{display:flex;align-items:center;gap:10px;padding-top:60px}
    .back{width:40px;height:40px;border-radius:999px;background:var(--card);box-shadow:var(--e1);
      display:flex;align-items:center;justify-content:center;color:var(--ink2)}
    .steps{margin-left:auto;display:flex;align-items:center;gap:6px}
    .st{width:22px;height:4px;border-radius:999px;background:var(--line2);display:block}
    .st.on{background:var(--ink)}
    .stn{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
      color:var(--ink3);margin-left:4px}

    .head{margin-top:36px}
    .q{font-family:var(--dis);font-weight:700;font-size:36px;line-height:38px;
      letter-spacing:-.028em;margin:0}
    .sub{font-size:14.5px;line-height:21px;color:var(--ink2);margin:12px 0 0;max-width:290px;text-wrap:pretty}

    .list{display:flex;flex-direction:column;gap:10px;margin-top:26px}
    .opt{display:flex;align-items:center;gap:13px;text-align:left;width:100%;
      background:var(--card);border-radius:16px;padding:15px 15px 16px;box-shadow:var(--e1);
      transition:transform 160ms var(--ease-out), box-shadow 200ms var(--ease-out)}
    .opt.on{box-shadow:0 0 0 2px var(--ink), var(--e1)}
    .sq{width:34px;height:34px;border-radius:10px;flex:none;display:flex;
      align-items:center;justify-content:center;color:#FBFAF7}
    .otx{min-width:0;flex:1}
    .o1{display:block;font-size:16px;font-weight:600;letter-spacing:-.01em}
    .o2{display:block;font-size:13px;line-height:18px;color:var(--ink2);margin-top:3px}
    .mark{width:24px;height:24px;border-radius:999px;flex:none;
      box-shadow:inset 0 0 0 1.7px var(--line2)}
    .mark.on{background:var(--signal);box-shadow:none;color:var(--ink);
      display:flex;align-items:center;justify-content:center}

    .foot{margin-top:auto;padding-bottom:34px}
    .count{font-size:13px;font-weight:600;color:var(--ink3);text-align:center;margin-bottom:12px}
    .go{width:100%;min-height:54px;border-radius:15px;background:var(--ink);color:var(--paper);
      font-size:16px;font-weight:600;letter-spacing:-.006em;
      display:flex;align-items:center;justify-content:center;gap:9px;box-shadow:var(--e2)}
    .skip{width:100%;min-height:44px;font-size:14px;font-weight:600;color:var(--ink3);
      display:flex;align-items:center;justify-content:center;margin-top:4px}
  </style>
</helmet>

<div class="screen">

  <div class="top">
    <button class="back">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m14 5-7 7 7 7"></path></svg>
    </button>
    <span class="steps">
      <span class="st on"></span>
      <span class="st on"></span>
      <span class="stn">2 von 2</span>
    </span>
  </div>

  <div class="head">
    <h1 class="q">Was ist dir wichtig?</h1>
    <p class="sub">Danach zeigt dir GetBetter nur diese Bereiche. Ein- und ausschalten kannst du sie jederzeit — nichts davon ist endgültig.</p>
  </div>

  <div class="list">

    <button class="opt on">
      <span class="sq" style="background:#4A5FD0">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
      </span>
      <span class="otx">
        <span class="o1">Organisation</span>
        <span class="o2">Kalender, Aufgaben, Notizen, Wecker und fünf weitere</span>
      </span>
      <span class="mark on">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"></path></svg>
      </span>
    </button>

    <button class="opt on">
      <span class="sq" style="background:#D0524A">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10"></path></svg>
      </span>
      <span class="otx">
        <span class="o1">Gesundheit</span>
        <span class="o2">Training, Menüplan, Trinken, Schlaf und drei weitere</span>
      </span>
      <span class="mark on">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"></path></svg>
      </span>
    </button>

    <button class="opt on">
      <span class="sq" style="background:#B0701F">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 11 12 4l8 7"></path><path d="M6 10v9h12v-9"></path><path d="M10 19v-5h4v5"></path></svg>
      </span>
      <span class="otx">
        <span class="o1">Haushalt</span>
        <span class="o2">Einkauf, Ämtli, Rezepte, Pflanzen und drei weitere</span>
      </span>
      <span class="mark on">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"></path></svg>
      </span>
    </button>

    <button class="opt">
      <span class="sq" style="background:#2E8C7A">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="2.5" y="6" width="19" height="13" rx="3"></rect><path d="M2.5 10.5h19M6 15h4"></path></svg>
      </span>
      <span class="otx">
        <span class="o1">Geld</span>
        <span class="o2">Budget, Rechnungen, Abos, Sparziele</span>
      </span>
      <span class="mark"></span>
    </button>

  </div>

  <div class="foot">
    <div class="count">3 gewählt · 22 Funktionen</div>
    <button class="go">
      Los geht's
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M12 5l7 7-7 7"></path></svg>
    </button>
    <button class="skip">Alles anzeigen</button>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {}
</script>
</body>
</html>
