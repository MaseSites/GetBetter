<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Zoom</title>
<style>
  body{margin:0;background:#E8E6DF}
  iframe{border:0;width:390px;height:844px;transform:scale(2);transform-origin:0 0;
    display:block;background:#fff}
</style>
</head>
<body>
<iframe id="f" src="Kalender.html"></iframe>
<script>
  const q = new URLSearchParams(location.search).get('a');
  if (q) document.getElementById('f').src = q + '.html';
</script>
</body>
</html>
