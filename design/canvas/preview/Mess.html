<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Mess</title>
<style>body{margin:0;background:#eee}iframe{border:0;width:390px;height:844px;position:absolute;left:-4000px}</style>
</head>
<body>
<pre id="out">…</pre>
<script>
const phones = ['Main','Dunkel','Bereiche','Kalender','Gesundheit','Haushalt','Geld','Assistent','Onboarding','Profil','RichtungB','RichtungC'];
const sheets = [['Fundament',960,2680],['Zustaende',1300,1300]];
const report = [];

function measure(doc, name, w, h) {
  const rows = [];
  // Scrollcontainer: der Bereich, der überlaufen darf
  for (const sel of ['.body','.thread','.list','.grid','.talk']) {
    const el = doc.querySelector(sel);
    if (el) rows.push(`${sel} ${el.scrollHeight - el.clientHeight}px über`);
  }
  // Wurzel: darf NIE überlaufen
  const root = doc.querySelector('.screen') || doc.querySelector('.sheet');
  const rootOver = root ? root.scrollHeight - root.clientHeight : 0;
  const docOver = doc.documentElement.scrollHeight - h;
  rows.push(`WURZEL ${rootOver}px | RAHMEN ${docOver}px`);
  report.push(`${name}: ${rows.join(' · ')}`);
}

let pending = phones.length + sheets.length;
function done() {
  if (--pending === 0) document.getElementById('out').textContent = report.join('\n');
}
for (const n of phones) {
  const f = document.createElement('iframe');
  f.src = n + '.html';
  f.onload = () => { measure(f.contentDocument, n, 390, 844); done(); };
  document.body.appendChild(f);
}
for (const [n, w, h] of sheets) {
  const f = document.createElement('iframe');
  f.style.width = w + 'px'; f.style.height = h + 'px';
  f.src = n + '.html';
  f.onload = () => { measure(f.contentDocument, n, w, h); done(); };
  document.body.appendChild(f);
}
</script>
</body>
</html>
